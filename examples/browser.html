<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCM 本地解密示例</title>
  <style>
    :root { font: 16px/1.7 system-ui, sans-serif; color: #192d35; background: #f3f6f6; }
    body { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 30px; line-height: 1.3; }
    main { background: white; border: 1px solid #dae3e5; border-radius: 14px; padding: 28px; }
    input[type=file] { display: block; margin: 24px 0; max-width: 100%; }
    label { display: block; font-size: 14px; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    #downloads a { display: inline-block; margin: 0 18px 12px 0; color: #006a69; }
    #downloads a:first-child { font-weight: 700; }
    img { display: block; max-width: 220px; border-radius: 8px; margin-top: 12px; }
    pre { max-height: 360px; overflow: auto; padding: 16px; background: #f3f6f6; font-size: 13px; }
  </style>
</head>
<body>
  <h1>NCM 本地解密</h1>
  <p>选择一个 NCM 文件，提取音频、歌曲信息和封面。全部处理在浏览器内完成。</p>
  <main>
    <label>选择文件<input id="file" type="file" accept=".ncm"></label>
    <label><input id="recover" type="checkbox"> 元数据损坏时尝试恢复音频</label>
    <p id="status" role="status">等待选择文件。</p>
    <div id="downloads"></div>
    <div id="cover"></div>
    <pre id="metadata" hidden></pre>
  </main>
  <p>“完整音频”会将已有的歌曲信息和封面写入音频文件，无需另外保存；音频数据不重新编码。也可单独下载原始音频、歌曲信息和封面。大文件需要容纳完整输入和输出的内存。</p>
  <script type="module" src="./browser.js"></script>
</body>
</html>
